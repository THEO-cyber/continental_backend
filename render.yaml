# Render Blueprint — connect this repo on Render and it reads this file
# automatically ("New +" -> "Blueprint"). See README.md "Deploying to
# Render" for the one-time manual steps this doesn't cover (custom domain,
# SITE_URL, changing the default admin password).
#
# Superadmin and Workers are hosted separately (static sites, e.g. Cloudflare
# Pages) and call this API cross-origin -- CORS_ORIGINS must list their real
# URLs once deployed.
services:
  - type: web
    name: continental-backend
    runtime: node
    # All real data lives off-box (MongoDB Atlas + Cloudinary), so unlike a
    # local-disk setup there's nothing here that a redeploy could wipe —
    # Starter just buys always-on (no cold-start spin-down); Free works too.
    plan: starter
    region: frankfurt # closest Render region to Cameroon
    buildCommand: >
      rm -rf vendor && mkdir -p vendor &&
      git clone --depth 1 https://github.com/THEO-cyber/continental_client.git vendor/continental_client &&
      rm -rf vendor/continental_client/.git &&
      npm install && npx prisma generate && npx nest build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false # your MongoDB Atlas connection string (mongodb+srv://...)
      - key: CLOUDINARY_URL
        sync: false # from the Cloudinary dashboard's "API Environment variable" box
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_DIR
        value: vendor/continental_client
      - key: SITE_URL
        sync: false # set this once you know your Render URL or custom domain
      - key: CORS_ORIGINS
        sync: false # comma-separated: the Superadmin and Workers static-site URLs
