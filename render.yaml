# Render Blueprint — connect this repo on Render and it reads this file
# automatically ("New +" -> "Blueprint"). See README.md "Deploying to
# Render" for the one-time manual steps this doesn't cover (custom domain,
# SITE_URL, changing the default admin password).
#
# Pure API + realtime server. The public site, superadmin, and workers are
# all separate static/Netlify-hosted apps that call this API cross-origin --
# CORS_ORIGINS must list their real URLs.
services:
  - type: web
    name: continental-backend
    runtime: node
    # All real data lives off-box (MongoDB Atlas + Cloudinary), so unlike a
    # local-disk setup there's nothing here that a redeploy could wipe —
    # Starter just buys always-on (no cold-start spin-down); Free works too.
    plan: starter
    region: frankfurt # closest Render region to Cameroon
    buildCommand: npm install && npx prisma generate && npx nest build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false # your MongoDB Atlas connection string (mongodb+srv://...)
      - key: CLOUDINARY_URL
        sync: false # from the Cloudinary dashboard's "API Environment variable" box
      - key: JWT_SECRET
        generateValue: true
      - key: SITE_URL
        sync: false # the public site's real URL (e.g. Netlify) -- legacy /en, /sitemap.xml etc. on this domain redirect here
      - key: CORS_ORIGINS
        sync: false # comma-separated: the public site's, Superadmin's, and Workers' real URLs
